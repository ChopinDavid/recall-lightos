[tool]
id = "com.dvdutch.recall"
label = "Recall"
versionCode = 2
versionName = "0.2.0"
permissions = ["android.permission.INTERNET"]

# cleartext-http: self-hosted Anki sync servers speak plain HTTP by default (a LAN
# endpoint like http://192.168.x.x:8080), and custom-server sync is this tool's
# primary sync path, so cleartext must be permitted in every build, including
# Light-built ones (which ignore src/debug and src/release manifest overlays).
# Users who want TLS can front the server with a reverse proxy and use https://.
capabilities = ["cleartext-http"]

# serverPackage = which package hosts the Light server this tool binds to. The SDK
# (LightSdkApplication) reads it from the generated LIGHT_SERVER_PACKAGE manifest
# meta-data at runtime to UnifiedPush.saveDistributor(...) and LightServiceConnection
# .bind(...). It does NOT affect this tool's own applicationId (that stays tool.id).
#
# `com.lightos` is LightOS on a real LP3, and the only value Light's build service
# accepts. To run against the LightOS emulator system app (docs/system_app), swap in
# `com.thelightphone.sdk.emulator` locally, don't commit it, and build with
# -DlightSdk.allowAltServerPackage=true (or set
# `systemProp.lightSdk.allowAltServerPackage=true` once in ~/.gradle/gradle.properties).
serverPackage = "com.lightos"
